name: Build & Publish Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-child-apk:
    name: Build Child Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Child Release APK
        working-directory: apps/child-android
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../child-app-release.apk

      - name: Upload Child APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: child-app-release
          path: child-app-release.apk

  build-parent-apk:
    name: Build Parent Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: apps/parent-flutter
        run: flutter pub get

      - name: Build Parent Release APK
        working-directory: apps/parent-flutter
        run: |
          flutter build apk --release --target-platform android-arm64,android-x64 --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk ../../parent-app-release.apk

      - name: Upload Parent APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: parent-app-release
          path: parent-app-release.apk

  publish-release:
    name: Create GitHub Release
    needs: [build-child-apk, build-parent-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Child APK
        uses: actions/download-artifact@v4
        with:
          name: child-app-release
          path: release_artifacts

      - name: Download Parent APK
        uses: actions/download-artifact@v4
        with:
          name: parent-app-release
          path: release_artifacts

      - name: Generate Checksums
        working-directory: release_artifacts
        run: |
          ls -la
          sha256sum child-app-release.apk parent-app-release.apk > checksums.txt
          cat checksums.txt

      - name: Release on GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_artifacts/child-app-release.apk
            release_artifacts/parent-app-release.apk
            release_artifacts/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
